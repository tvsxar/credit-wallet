name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: admin_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: credit_wallet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin_user -d credit_wallet_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    env:
      TEST_PG_STRING: postgresql://admin_user:test_password@127.0.0.1:5432/credit_wallet_test
      BETTER_AUTH_URL: http://localhost:2111
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build backend
        run: npm run build

      - name: Build Docker image
        run: docker build -t credit-wallet-backend .
